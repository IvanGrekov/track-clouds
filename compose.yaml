services:
  telegram-monitor:
    build: .
    restart: unless-stopped
    stop_grace_period: 15s
    env_file:
      - .env
    volumes:
      - type: bind
        source: ./config.toml
        target: /app/config.toml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./policy-prompt.txt
        target: /app/policy-prompt.txt
        read_only: true
        bind:
          create_host_path: false
      - telegram-monitor-state:/app/.state

volumes:
  telegram-monitor-state:
